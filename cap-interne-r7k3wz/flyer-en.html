  /* Voile marine plus dense a gauche : le texte y est lisible, la grimpeuse
     reste degagee a droite. */
  /* Voile allege : la baie et les karsts respirent davantage. Les valeurs
     de gauche restent hautes, c'est la que le texte blanc doit tenir. */
  .scrim{position:absolute;inset:0;
    background:linear-gradient(100deg,rgba(18,42,58,.86) 0%,rgba(18,42,58,.76) 34%,
               rgba(18,42,58,.34) 56%,rgba(18,42,58,.06) 74%,rgba(18,42,58,0) 100%);}
  .wrap{position:absolute;inset:0;padding:76px 72px 64px;display:flex;flex-direction:column;}
  /* Logo centre sur la largeur de la toile, a hauteur de la pastille. Sur
     le bord droit il tombait sur le calcaire clair et se perdait dans la
     texture ; au centre il est sur le ciel, dans la partie voilee. */
  .head{position:relative;display:flex;align-items:center;min-height:56px;}
  .chip{border:2px solid rgba(255,255,255,.85);border-radius:99px;
        padding:11px 24px;color:#fff;font-size:20px;font-weight:700;letter-spacing:3px;}
  /* Ombre portee : le logo est un trait blanc fin et il tombe sur la
     falaise claire. Sans elle il disparait dans le calcaire. */
  /* Pas de cercle : le logo est deja blanc, il tient seul sur le fond.
     Juste une ombre douce, invisible comme forme, qui lui donne un bord
     la ou le ciel est clair. */
  .mark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
        display:flex;align-items:center;justify-content:center;}
  .logo{width:126px;height:126px;filter:drop-shadow(0 2px 10px rgba(0,0,0,.45));}
  h1{color:#fff;font-size:100px;font-weight:700;line-height:.93;letter-spacing:-1.5px;
     margin:38px 0 0;text-shadow:0 3px 26px rgba(0,0,0,.35);}
  .country{color:rgba(255,255,255,.92);font-size:40px;font-weight:700;letter-spacing:2px;margin-top:14px;}
  .rule{width:96px;height:6px;background:#c0392b;border-radius:3px;margin:26px 0 26px;}
  .sub{color:rgba(255,255,255,.94);font-size:26px;line-height:1.45;max-width:540px;font-weight:400;}
  .facts{margin-top:auto;margin-bottom:8px;display:flex;flex-direction:column;gap:22px;}
  .fact{border-left:5px solid #6fae84;padding-left:20px;}
  .fact b{display:block;color:#fff;font-size:31px;font-weight:700;letter-spacing:.3px;}
  .fact span{display:block;color:rgba(255,255,255,.72);font-size:21px;margin-top:3px;}
  .foot{margin-top:48px;display:flex;align-items:flex-end;}
  /* La fleche est un trace SVG, pas le glyphe &rarr;. Liberation Sans n'a
     pas ce caractere : il tombait dans une police de repli qui ignore le
     gras, d'ou une fleche fine a cote de capitales lourdes, trop petite et
     posee sous l'axe optique. En SVG on regle l'epaisseur sur celle des
     fûts de la police et on centre a la main. */
  .cta{background:#c0392b;color:#fff;border-radius:99px;padding:27px 48px;
       font-size:33px;font-weight:700;letter-spacing:1.6px;white-space:nowrap;
       display:inline-flex;align-items:center;gap:18px;}
  .arw{width:32px;height:22px;flex:none;margin-top:-2px;}
  .url{margin-top:24px;color:#fff;font-size:31px;font-weight:700;letter-spacing:.4px;}
